_metadata:
  major_version: 2
  minor_version: 1
display_information:
  name: jira-triage-bot
features:
  bot_user:
    display_name: triage
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - users:write
settings:
  socket_mode_enabled: true
  event_subscriptions:
    bot_events:
      - app_mention
