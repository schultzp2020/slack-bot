_metadata:
  major_version: 2
  minor_version: 1
display_information:
  name: jira-triage-bot
features:
  bot_user:
    display_name: triage
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - users:write
  slash_commands:
    - command: /triage
      description: Triage tracker issues
    - command: /refinement
      description: Assess whether issues are ready to move forward
    - command: /stats
      description: Show usage and cost totals
    - command: /warden
      description: Read or set the warden hold threshold
settings:
  socket_mode_enabled: true
  event_subscriptions:
    bot_events:
      - app_mention
