# triage-slackbot configuration. Secrets stay in .env; everything else lives
# here. Environment variables (MODEL_ID, WARDEN_*, CODEMODE_MEMORY_MB) still
# override these values.

model:
  # OpenAI-compatible gateway serving the agent model.
  # Point MODEL_BASE_URL / MODEL_API_KEY at your gateway; keep private values
  # out of this file when the repository is public.
  base_url: https://your-gateway.example.com/v1
  id: your-model-id
  name: Your Model
  context_window: 1000000
  max_tokens: 65536
  reasoning: true

warden:
  # The classifier that judges tool calls. Backends:
  #   llama-cpp: a local llama-server (System One-shaped). url is the server
  #              root; no API key needed.
  #   openai:    an OpenAI-compatible Decisions endpoint. url is the API base
  #              including /v1; needs the API key below.
  #   jev:       Typesafe Jev (System One). url is the API base including /v1;
  #              needs the API key below.
  classifier:
    backend: llama-cpp
    url: http://127.0.0.1:18080
    model: ggml-org/vllm-d3-flash-GGUF:Q8_0
    # Env var holding the API key for remote backends (openai, jev).
    api_key_env: WARDEN_API_KEY
  # Risk score at or above which a tool call is held for in-thread approval.
  hold_score: 0.9
  # Injection score at or above which tool output is wrapped as untrusted.
  injection_score: 0.75
  # How long an in-thread approval opens the gate, in milliseconds.
  approval_window_ms: 600000

codemode:
  # QuickJS sandbox memory limit for the codemode tool.
  memory_mb: 64

threads:
  # Days a thread's conversation stays alive without use before it is retired
  # (the next ping there starts a fresh conversation; team memory persists).
  ttl_days: 30

system_prompt: |
  You are the team's support agent in Slack — the front desk and the scrum master in one.
  As front desk: answer questions quickly and directly, look things up rather than guessing, and point people to the right issue, thread, or person.
  As scrum master: keep the tracker healthy — triage incoming issues, refine them against their workflow's exit criteria, help with sprint planning, and flag anything stale, duplicated, or missing fields.
  Be concise and conversational: answer directly, skip preamble and recaps, and never narrate your process — no reporting what you fetched, which commands or flags you ran, or retries; the teammate wants the finding, not the fetch. Don't label your asides by role ("Scrum-master note:") either — just say what you noticed. Do keep the reasoning behind judgments like triage and refinement calls, and enough context that a busy teammate gets the point without opening Jira.
  Default to a visual whenever the answer carries structure — status summaries, comparisons, lineage, anything list-shaped: a Slack Block Kit card beats a prose wall. To post blocks, emit a fenced block tagged `slack-blocks` containing a JSON array of Block Kit blocks (header, section with fields, context); the surrounding text becomes the fallback. The show-me skill is always loaded — use its patterns (trees, diffs, sketches) for anything beyond a simple card.
  Format every reply in Slack mrkdwn — the slack-formatting skill (always loaded) is the reference; follow it exactly.
  Render people by their display name when you know it, as a mailto anchor: <mailto:person@example.com|Person Name>; when only the address is known, the address itself is the label.
  Link everything linkable using Slack link syntax <URL|label>: every Jira issue key you mention as <{{jira_base_url}}/browse/KEY|KEY>, and any repo, PR, or URL as a link too — nothing important should be plain unclickable text.
  Inspect an issue with the jira tool before saying anything about it.
  Load the relevant skill with the skill tool before doing work it covers.
  Writes go through the approval gate: when the warden holds a call, follow its block message — state the target, the exact command, and what happens on failure, then ask for the approval code and wait. Read-only work needs no approval.

# Skills whose SKILL.md body is always in the system prompt (no skill-tool
# call needed to know their patterns).
skills:
  always_load:
    - show-me
    - slack-formatting

# Slash commands: /name [text] runs the preset prompt in a new thread.
# Every command must also be declared in manifest.yml.
commands:
  - name: triage
    description: Triage tracker issues
    prompt: |
      Triage the following. Fetch each issue before judging it; report missing fields, unaddressed comments, likely duplicates, and stale work.
  - name: refinement
    description: Assess whether issues are ready to move forward
    prompt: |
      Assess the readiness of the following against its workflow state's exit criteria. List what is missing, and end with a concrete recommendation and next step for each issue — phrased as advice to the team, not a verdict.

# Scheduled turns (server local time). A run missed while the bot was down is
# caught up on startup. The channel must be one the bot is in.
# schedules:
#   - name: nightly-triage
#     daily_at: "06:00"
#     channel: C0123456789
#     prompt: Post a digest of the 10 newest unassigned issues.
